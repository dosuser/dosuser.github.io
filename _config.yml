lang: ko-KR

# Theme
# Use the public custom domain consistently for canonical URLs and the sitemap.
url: "https://blog.dosuser.com"
baseurl: ""

theme: jekyll-theme-chirpy

title: dosuser's blog

tagline: Personal blog about development, spring, and distributed storage

description: >-
  개발, 스프링, 분산 스토리지에 대해 기록하는 개인 블로그.

timezone: Asia/Seoul

github:
  username: dosuser

social:
  name: SHIN DAE YONG
  email: dosuser@naver.com
  links:
    - https://github.com/dosuser
    - https://www.instagram.com/dosuser
    - https://www.facebook.com/daeyong.shin.96

avatar: /assets/images/logo.svg

# Site behavior
paginate: 10

theme_mode: light

# Add the GA4 Measurement ID after creating a Web data stream in Google Analytics.
# Leave this empty until then: the Chirpy theme will not emit an analytics script.
analytics:
  google:
    id: "G-E96G987ZLS"

# Build settings
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - .sass-cache
  - .jekyll-cache
  - .bundle
  - README.md
