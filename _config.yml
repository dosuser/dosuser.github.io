lang: ko-KR

# Theme
# Use the public custom domain consistently for canonical URLs and the sitemap.
url: "https://blog.dosuser.com"
baseurl: ""

theme: jekyll-theme-chirpy

title: dosuser's blog

tagline: LLM, AI 에이전트, 마케팅 실험을 기록합니다

description: >-
  LLM, AI 에이전트, 마케팅 기술의 변화와 실제 구현·실험을 기록하는 신대용의 기술 블로그.

author: SHIN DAE YONG
logo: /assets/images/logo.svg

timezone: Asia/Seoul

github:
  username: dosuser

social:
  name: SHIN DAE YONG
  email: dosuser@naver.com
  links:
    - https://github.com/dosuser
    - https://www.instagram.com/dosuser
    - https://www.facebook.com/daeyong.shin.96

avatar: /assets/images/logo.svg

# Site behavior
paginate: 10

theme_mode: light

# Add the GA4 Measurement ID after creating a Web data stream in Google Analytics.
# Leave this empty until then: the Chirpy theme will not emit an analytics script.
analytics:
  google:
    id: "G-E96G987ZLS"

# Build settings
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - .sass-cache
  - .jekyll-cache
  - .bundle
  - README.md
