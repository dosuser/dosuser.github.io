<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">멈추지 않은 백그라운드 AI 에이전트 루프</title>
  <desc id="desc">Mac 로그인 후 로컬 게이트웨이가 10분마다 AI 세션을 만들고, 같은 보드와 작업일지를 반복해서 읽으며, 실패와 사용량 고갈에도 다음 실행을 예약한 사고 흐름</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <style>
      .bg{fill:#f8fafc}.titlebar{fill:#0f172a}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}.trigger{fill:#dbeafe;stroke:#2563eb;stroke-width:2}.agent{fill:#e0e7ff;stroke:#4f46e5;stroke-width:2}.step{fill:#f1f5f9;stroke:#64748b;stroke-width:2}.decision{fill:#fef3c7;stroke:#d97706;stroke-width:3}.useful{fill:#dcfce7;stroke:#16a34a;stroke-width:2}.warn{fill:#ffedd5;stroke:#ea580c;stroke-width:2}.log{fill:#f3e8ff;stroke:#9333ea;stroke-width:2}.fail{fill:#fee2e2;stroke:#dc2626;stroke-width:3}.metric{fill:#e0f2fe;stroke:#0284c7;stroke-width:2}.metricbad{fill:#fee2e2;stroke:#dc2626;stroke-width:3}.arrow{fill:none;stroke:#64748b;stroke-width:3;marker-end:url(#arrow)}.feedback{fill:none;stroke:#dc2626;stroke-width:4;stroke-dasharray:11 9;marker-end:url(#arrow-red)}.t{font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#0f172a;text-anchor:middle;font-size:24px}.small{font-size:19px;fill:#475569}.white{fill:#f8fafc}.strong{font-weight:700}.edge{font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:19px;fill:#475569;text-anchor:middle}.red{fill:#b91c1c}.green{fill:#166534}
    </style>
  </defs>
  <rect class="bg" width="1600" height="1100"/>
  <rect class="titlebar" x="0" y="0" width="1600" height="82"/>
  <text class="t white strong" x="800" y="53" font-size="34">멈추지 않은 백그라운드 AI 에이전트 루프</text>

  <rect class="trigger" x="55" y="115" width="300" height="100" rx="16"/>
  <text class="t" x="205" y="157"><tspan x="205">Mac 로그인</tspan><tspan class="small" x="205" dy="31">사용자 세션 시작</tspan></text>
  <rect class="trigger" x="435" y="115" width="300" height="100" rx="16"/>
  <text class="t" x="585" y="151"><tspan x="585">LaunchAgent</tspan><tspan class="small" x="585" dy="31">로컬 게이트웨이 자동 시작</tspan></text>
  <rect class="trigger" x="815" y="115" width="300" height="100" rx="16"/>
  <text class="t" x="965" y="151"><tspan x="965">백로그 처리 예약 작업</tspan><tspan class="small strong" x="965" dy="31">10분마다</tspan></text>
  <rect class="agent" x="1195" y="115" width="350" height="100" rx="16"/>
  <text class="t" x="1370" y="151"><tspan x="1370">AI 코딩 에이전트</tspan><tspan class="small" x="1370" dy="31">새 루트 세션 생성</tspan></text>
  <path class="arrow" d="M355 165 H435"/><path class="arrow" d="M735 165 H815"/><path class="arrow" d="M1115 165 H1195"/>

  <rect class="panel" x="55" y="255" width="1490" height="610" rx="22"/>
  <text class="t strong" x="300" y="294">작업일지가 남은 많은 회차의 공통 패턴</text>

  <rect class="step" x="95" y="330" width="300" height="120" rx="16"/>
  <text class="t" x="245" y="370"><tspan x="245">같은 입력 재검사</tspan><tspan class="small" x="245" dy="30">전역 규칙 · 보드 캐시</tspan><tspan class="small" x="245" dy="27">최근 일지 10~15개 · 잠금</tspan></text>

  <polygon class="decision" points="500,390 625,305 750,390 625,475"/>
  <text class="t" x="625" y="378"><tspan x="625">실행 가능한</tspan><tspan x="625" dy="31">비중복 후보?</tspan></text>
  <path class="arrow" d="M395 390 H500"/>

  <rect class="useful" x="835" y="310" width="280" height="105" rx="16"/>
  <text class="t" x="975" y="350"><tspan x="975">격리 복제본</tspan><tspan class="small" x="975" dy="31">분석 · 수정 · 로컬 테스트</tspan></text>
  <rect class="useful" x="1210" y="310" width="285" height="105" rx="16"/>
  <text class="t" x="1352" y="350"><tspan x="1352">일부 유효한 결과</tspan><tspan class="small strong green" x="1352" dy="31">미커밋 로컬 패치</tspan></text>
  <path class="arrow" d="M750 365 H835"/><text class="edge green" x="790" y="347">일부 있음</text>
  <path class="arrow" d="M1115 362 H1210"/>

  <rect class="warn" x="835" y="480" width="280" height="105" rx="16"/>
  <text class="t" x="975" y="520"><tspan x="975">후보 0건</tspan><tspan class="small" x="975" dy="31">안전 보류 · 진행 중</tspan></text>
  <path class="arrow" d="M700 444 C750 500 770 532 835 532"/><text class="edge red" x="775" y="500">없음 · 잠금/인증 실패</text>

  <rect class="log" x="1210" y="480" width="285" height="105" rx="16"/>
  <text class="t" x="1352" y="520"><tspan x="1352">새 작업일지 작성</tspan><tspan class="small" x="1352" dy="31">다음 회차 입력으로 누적</tspan></text>
  <path class="arrow" d="M975 415 V450 H1300 V480"/><path class="arrow" d="M1115 532 H1210"/>
  <path class="feedback" d="M1210 550 C1030 650 420 650 245 450"/>
  <text class="edge red strong" x="730" y="630">자기 산출물을 다시 읽는 되먹임</text>

  <rect class="decision" x="470" y="650" width="260" height="85" rx="16"/>
  <text class="t" x="600" y="684"><tspan x="600">게이트웨이의</tspan><tspan x="600" dy="31">회차 상태</tspan></text>
  <path class="arrow" d="M1352 585 C1330 680 850 670 730 692"/>

  <rect class="fail" x="95" y="755" width="245" height="78" rx="14"/>
  <text class="t" x="217" y="788"><tspan x="217">600초 시간 초과</tspan><tspan class="small" x="217" dy="27">활동 상태는 initializing</tspan></text>
  <rect class="fail" x="375" y="755" width="245" height="78" rx="14"/>
  <text class="t" x="497" y="788"><tspan x="497">파일 한도 · 사용량 고갈</tspan><tspan class="small" x="497" dy="27">오류 또는 빈 결과</tspan></text>
  <rect class="step" x="655" y="755" width="210" height="78" rx="14"/>
  <text class="t" x="760" y="803">정상 종료</text>
  <path class="arrow" d="M520 735 C430 745 320 740 217 755"/><path class="arrow" d="M600 735 C570 745 535 750 497 755"/><path class="arrow" d="M680 735 C720 745 740 750 760 755"/>

  <rect class="warn" x="1020" y="735" width="415" height="105" rx="16"/>
  <text class="t" x="1227" y="773"><tspan x="1227">자동 중단 · 지수 백오프 없음</tspan><tspan class="small strong red" x="1227" dy="32">다음 10분 예약 유지</tspan></text>
  <path class="arrow" d="M340 794 C650 900 880 830 1020 790"/><path class="arrow" d="M620 794 C780 860 900 825 1020 790"/><path class="arrow" d="M865 794 H1020"/>
  <path class="feedback" d="M1435 785 C1545 700 1570 310 1370 215"/>

  <text class="t strong" x="800" y="910">2026-08-22~23 관찰 결과</text>
  <rect class="metric" x="55" y="945" width="345" height="115" rx="16"/>
  <text class="t" x="227" y="986"><tspan x="227">예약 루트 세션</tspan><tspan class="strong" x="227" dy="38" font-size="34">84개</tspan></text>
  <rect class="metric" x="435" y="945" width="345" height="115" rx="16"/>
  <text class="t" x="607" y="986"><tspan x="607">칸반 작업일지</tspan><tspan class="strong" x="607" dy="38" font-size="34">72개</tspan></text>
  <rect class="metric" x="815" y="945" width="345" height="115" rx="16"/>
  <text class="t" x="987" y="984"><tspan x="987">루트 세션 기록</tspan><tspan class="strong" x="987" dy="38" font-size="30">437,993,236 tokens</tspan></text>
  <rect class="metricbad" x="1195" y="945" width="350" height="115" rx="16"/>
  <text class="t" x="1370" y="974"><tspan class="small" x="1370">조사 범위에서 확인된</tspan><tspan x="1370" dy="28">commit · push · PR · 배포</tspan><tspan class="strong red" x="1370" dy="36" font-size="34">0건</tspan></text>
</svg>
