<svg xmlns="http://www.w3.org/2000/svg" width="700" height="2520" viewBox="0 0 700 2520" role="img" aria-labelledby="title desc">
  <title id="title">내가 모르는 사이 10분마다 돌아간 AI 에이전트 모바일 흐름도</title>
  <desc id="desc">Hermes가 Mac 로그인과 함께 자동으로 시작되고, 내가 알지 못한 예약 작업이 10분마다 Codex 세션과 큰 컨텍스트를 다시 만든 과정을 세로로 설명한 흐름도</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L10 5 L0 10z" fill="#64748b"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L10 5 L0 10z" fill="#dc2626"/>
    </marker>
    <style>
      .bg{fill:#f8fafc}.titlebar{fill:#0f172a}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:3}.trigger{fill:#dbeafe;stroke:#2563eb;stroke-width:3}.agent{fill:#e0e7ff;stroke:#4f46e5;stroke-width:3}.step{fill:#f1f5f9;stroke:#64748b;stroke-width:3}.decision{fill:#fef3c7;stroke:#d97706;stroke-width:3}.useful{fill:#dcfce7;stroke:#16a34a;stroke-width:3}.warn{fill:#ffedd5;stroke:#ea580c;stroke-width:3}.log{fill:#f3e8ff;stroke:#9333ea;stroke-width:3}.fail{fill:#fee2e2;stroke:#dc2626;stroke-width:3}.metric{fill:#e0f2fe;stroke:#0284c7;stroke-width:3}.metricbad{fill:#fee2e2;stroke:#dc2626;stroke-width:3}.arrow{fill:none;stroke:#64748b;stroke-width:4;marker-end:url(#arrow)}.feedback{fill:none;stroke:#dc2626;stroke-width:5;stroke-dasharray:12 10;marker-end:url(#arrow-red)}.t{font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#0f172a;text-anchor:middle;font-size:27px}.small{font-size:24px;fill:#475569}.white{fill:#f8fafc}.strong{font-weight:700}.edge{font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:24px;fill:#475569;text-anchor:middle}.red{fill:#b91c1c}.green{fill:#166534}
    </style>
  </defs>

  <rect class="bg" width="700" height="2520"/>
  <rect class="titlebar" width="700" height="100"/>
  <text class="t white strong" x="350" y="43" font-size="34">
    <tspan x="350">내가 모르는 사이 10분마다</tspan>
    <tspan x="350" dy="39">돌아간 AI 에이전트</tspan>
  </text>

  <rect class="trigger" x="80" y="135" width="540" height="95" rx="16"/>
  <text class="t" x="350" y="174"><tspan x="350">Mac 로그인</tspan><tspan class="small" x="350" dy="31">Hermes는 직접 열지 않음</tspan></text>
  <path class="arrow" d="M350 230 V260"/>
  <rect class="trigger" x="80" y="260" width="540" height="95" rx="16"/>
  <text class="t" x="350" y="299"><tspan x="350">LaunchAgent</tspan><tspan class="small" x="350" dy="31">Hermes 게이트웨이 자동 시작</tspan></text>
  <path class="arrow" d="M350 355 V385"/>
  <rect class="trigger" x="80" y="385" width="540" height="95" rx="16"/>
  <text class="t" x="350" y="424"><tspan x="350">내가 모르고 있던 예약 작업</tspan><tspan class="small strong" x="350" dy="31">10분마다 실행</tspan></text>
  <path class="arrow" d="M350 480 V510"/>
  <rect class="agent" x="80" y="510" width="540" height="95" rx="16"/>
  <text class="t" x="350" y="549"><tspan x="350">Codex</tspan><tspan class="small" x="350" dy="31">새 루트 세션 생성</tspan></text>

  <rect class="panel" x="25" y="650" width="650" height="875" rx="24"/>
  <text class="t strong" x="350" y="700" font-size="28">매번 다시 만든 큰 컨텍스트</text>

  <rect class="step" x="70" y="730" width="560" height="125" rx="16"/>
  <text class="t" x="350" y="771"><tspan x="350">큰 컨텍스트를 다시 만듦</tspan><tspan class="small" x="350" dy="32">전역 규칙 · 보드 · 잠금</tspan><tspan class="small" x="350" dy="30">최근 작업일지 10~15개</tspan></text>
  <path class="arrow" d="M350 855 V885"/>

  <polygon class="decision" points="350,885 590,965 350,1045 110,965"/>
  <text class="t" x="350" y="953"><tspan x="350">겹치지 않는</tspan><tspan x="350" dy="34">새 작업이 있나?</tspan></text>

  <path class="arrow" d="M250 1015 C185 1045 170 1065 170 1090"/>
  <text class="edge green" x="165" y="1050">일부 있음</text>
  <rect class="useful" x="45" y="1090" width="290" height="125" rx="16"/>
  <text class="t" x="190" y="1131"><tspan x="190">격리 복제본</tspan><tspan class="small" x="190" dy="32">분석 · 수정</tspan><tspan class="small" x="190" dy="30">로컬 테스트</tspan></text>
  <path class="arrow" d="M190 1215 V1245"/>
  <rect class="useful" x="45" y="1245" width="290" height="125" rx="16"/>
  <text class="t" x="190" y="1286"><tspan x="190">일부 유효한 결과</tspan><tspan class="small strong green" x="190" dy="34">미커밋 로컬 패치</tspan></text>

  <path class="arrow" d="M450 1015 C515 1045 530 1065 530 1090"/>
  <text class="edge red" x="535" y="1050">없음 · 잠금/인증 실패</text>
  <rect class="warn" x="365" y="1090" width="290" height="125" rx="16"/>
  <text class="t" x="510" y="1131"><tspan x="510">후보 0건</tspan><tspan class="small" x="510" dy="32">안전 보류</tspan><tspan class="small" x="510" dy="30">또는 진행 중</tspan></text>

  <path class="arrow" d="M510 1215 V1245"/>
  <path class="arrow" d="M335 1308 H365"/>
  <rect class="log" x="365" y="1245" width="290" height="125" rx="16"/>
  <text class="t" x="510" y="1286"><tspan x="510">새 작업일지 작성</tspan><tspan class="small" x="510" dy="32">다음 회차 입력으로</tspan><tspan class="small" x="510" dy="30">다시 누적</tspan></text>

  <path class="feedback" d="M510 1370 C510 1470 40 1470 40 800 C40 760 55 750 70 750"/>
  <text class="edge red strong" x="350" y="1485">방금 쓴 일지를 10분 뒤 다시 읽음</text>

  <rect class="panel" x="25" y="1560" width="650" height="570" rx="24"/>
  <text class="t strong" x="350" y="1613" font-size="31">Hermes가 기록한 실행 상태</text>

  <polygon class="decision" points="350,1645 535,1710 350,1775 165,1710"/>
  <text class="t" x="350" y="1700"><tspan x="350">회차 결과</tspan><tspan class="small" x="350" dy="31">정상 · 오류 · 시간 초과</tspan></text>

  <path class="arrow" d="M250 1745 C185 1770 150 1790 135 1815"/>
  <path class="arrow" d="M350 1775 V1815"/>
  <path class="arrow" d="M450 1745 C515 1770 550 1790 565 1815"/>
  <rect class="fail" x="45" y="1815" width="185" height="125" rx="15"/>
  <text class="t" x="137" y="1855"><tspan x="137">600초</tspan><tspan x="137" dy="31">시간 초과</tspan><tspan class="small" x="137" dy="29">상태는 initializing</tspan></text>
  <rect class="fail" x="257" y="1815" width="186" height="125" rx="15"/>
  <text class="t" x="350" y="1855"><tspan x="350">파일 한도</tspan><tspan x="350" dy="31">사용량 고갈</tspan><tspan class="small" x="350" dy="29">오류 · 빈 결과</tspan></text>
  <rect class="step" x="470" y="1815" width="185" height="125" rx="15"/>
  <text class="t" x="562" y="1888">정상 종료</text>

  <path class="arrow" d="M137 1940 C155 1970 205 1975 260 1985"/>
  <path class="arrow" d="M350 1940 V1970"/>
  <path class="arrow" d="M562 1940 C545 1970 495 1975 440 1985"/>
  <rect class="warn" x="70" y="1970" width="560" height="120" rx="17"/>
  <text class="t" x="350" y="2012"><tspan x="350">자동 중단 · 지수 백오프 없음</tspan><tspan class="small strong red" x="350" dy="36">다음 10분 예약 유지</tspan></text>
  <path class="feedback" d="M630 2030 C675 1910 680 650 620 557"/>

  <text class="t strong" x="350" y="2190" font-size="31">뒤늦게 로그에서 확인한 결과</text>
  <rect class="metric" x="30" y="2220" width="310" height="105" rx="16"/>
  <text class="t" x="185" y="2260"><tspan x="185">예약 루트 세션</tspan><tspan class="strong" x="185" dy="39" font-size="34">84개</tspan></text>
  <rect class="metric" x="360" y="2220" width="310" height="105" rx="16"/>
  <text class="t" x="515" y="2260"><tspan x="515">칸반 작업일지</tspan><tspan class="strong" x="515" dy="39" font-size="34">72개</tspan></text>
  <rect class="metric" x="30" y="2350" width="310" height="120" rx="16"/>
  <text class="t" x="185" y="2390"><tspan x="185">루트 세션 기록</tspan><tspan class="strong" x="185" dy="37" font-size="27">437,993,236 tokens</tspan></text>
  <rect class="metricbad" x="360" y="2350" width="310" height="135" rx="16"/>
  <text class="t" x="515" y="2388"><tspan class="small" x="515">로그에서 확인한</tspan><tspan class="small" x="515" dy="31">커밋 · 푸시 · PR · 배포</tspan><tspan class="strong red" x="515" dy="39" font-size="34">0건</tspan></text>
</svg>
