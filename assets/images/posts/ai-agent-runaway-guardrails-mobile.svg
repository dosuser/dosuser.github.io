<svg xmlns="http://www.w3.org/2000/svg" width="700" height="2680" viewBox="0 0 700 2680" role="img" aria-labelledby="title desc">
  <title id="title">재발 방지를 위한 모바일 실행 게이트 비교</title>
  <desc id="desc">사고 당시의 무제한 실행 구조와 사전 검사, 예산, 단일 실행, 실제 활동 추적, 회로 차단기와 사람 알림을 갖춘 개선 구조를 세로로 비교한 도표</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L10 5 L0 10z" fill="#64748b"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L10 5 L0 10z" fill="#dc2626"/>
    </marker>
    <style>
      .bg{fill:#f8fafc}.titlebar{fill:#0f172a}.oldpanel{fill:#fff7f7;stroke:#dc2626;stroke-width:3}.newpanel{fill:#f7fbff;stroke:#2563eb;stroke-width:3}.old{fill:#fee2e2;stroke:#dc2626;stroke-width:3}.gate{fill:#dbeafe;stroke:#2563eb;stroke-width:3}.work{fill:#dcfce7;stroke:#16a34a;stroke-width:3}.decision{fill:#fef3c7;stroke:#d97706;stroke-width:3}.stop{fill:#ffedd5;stroke:#ea580c;stroke-width:3}.audit{fill:#f3e8ff;stroke:#9333ea;stroke-width:3}.bad{fill:#7f1d1d;stroke:#450a0a;stroke-width:3}.good{fill:#14532d;stroke:#052e16;stroke-width:3}.arrow{fill:none;stroke:#64748b;stroke-width:4;marker-end:url(#arrow)}.redarrow{fill:none;stroke:#dc2626;stroke-width:5;stroke-dasharray:12 10;marker-end:url(#arrow-red)}.t{font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#0f172a;text-anchor:middle;font-size:27px}.small{font-size:24px;fill:#475569}.white{fill:#f8fafc}.strong{font-weight:700}.red{fill:#b91c1c}.green{fill:#166534}.edge{font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#475569;text-anchor:middle;font-size:24px}
    </style>
  </defs>

  <rect class="bg" width="700" height="2680"/>
  <rect class="titlebar" width="700" height="110"/>
  <text class="t white strong" x="350" y="45" font-size="34"><tspan x="350">재발 방지</tspan><tspan x="350" dy="40">프롬프트가 아니라 시스템이 멈춘다</tspan></text>

  <rect class="oldpanel" x="25" y="145" width="650" height="850" rx="24"/>
  <text class="t strong red" x="350" y="198" font-size="32">사고 당시</text>

  <rect class="old" x="70" y="230" width="560" height="100" rx="16"/>
  <text class="t" x="350" y="273"><tspan x="350">10분마다 조건 없이 시작</tspan><tspan class="small" x="350" dy="33">실행 전 후보 · 예산 검사 없음</tspan></text>
  <path class="arrow" d="M350 330 V355"/>
  <rect class="old" x="70" y="355" width="560" height="100" rx="16"/>
  <text class="t" x="350" y="398"><tspan x="350">불완전한 작업 카드도</tspan><tspan x="350" dy="33">모델이 매번 다시 해석</tspan></text>
  <path class="arrow" d="M350 455 V480"/>
  <rect class="old" x="70" y="480" width="560" height="100" rx="16"/>
  <text class="t" x="350" y="523"><tspan x="350">자기 작업일지를</tspan><tspan x="350" dy="33">다음 입력으로 재사용</tspan></text>
  <path class="arrow" d="M350 580 V605"/>
  <rect class="old" x="70" y="605" width="560" height="100" rx="16"/>
  <text class="t" x="350" y="648"><tspan x="350">실제 활동과 상태 추적이</tspan><tspan x="350" dy="33">서로 불일치</tspan></text>
  <path class="arrow" d="M350 705 V730"/>
  <rect class="old" x="70" y="730" width="560" height="100" rx="16"/>
  <text class="t" x="350" y="773"><tspan x="350">토큰 예산과</tspan><tspan x="350" dy="33">연속 실패 차단기 없음</tspan></text>
  <path class="arrow" d="M350 830 V855"/>
  <rect class="bad" x="70" y="855" width="560" height="105" rx="16"/>
  <text class="t white strong" x="350" y="897"><tspan x="350">실패가 다음 실행을 부르는</tspan><tspan x="350" dy="36">무제한 루프</tspan></text>
  <path class="redarrow" d="M70 907 C35 835 38 285 70 280"/>

  <rect class="gate" x="70" y="1025" width="560" height="100" rx="18"/>
  <text class="t strong" x="350" y="1066"><tspan x="350">운영 계약을 코드로 강제</tspan><tspan class="small" x="350" dy="34">멈출 조건을 실행 전에 결정</tspan></text>
  <path class="arrow" d="M350 1125 V1155"/>

  <rect class="newpanel" x="25" y="1155" width="650" height="1265" rx="24"/>
  <text class="t strong" x="350" y="1210" font-size="32" fill="#1d4ed8">개선된 실행 게이트</text>

  <rect class="gate" x="80" y="1240" width="540" height="100" rx="16"/>
  <text class="t" x="350" y="1281"><tspan class="strong" x="350">1. 사전 검사</tspan><tspan class="small" x="350" dy="34">작업 카드 스키마 · 후보 수</tspan></text>
  <path class="arrow" d="M350 1340 V1365"/>
  <path class="arrow" d="M350 1340 V1350 C350 1360 250 1360 250 1380"/>
  <text class="edge green" x="245" y="1364">후보 있음</text>
  <rect class="gate" x="45" y="1380" width="410" height="120" rx="16"/>
  <text class="t" x="250" y="1426"><tspan class="strong" x="250">2. 예산 검사</tspan><tspan class="small" x="250" dy="35">토큰 · 시간 · 도구 호출 상한</tspan></text>

  <path class="arrow" d="M500 1340 C555 1350 565 1360 565 1380"/>
  <text class="edge red" x="565" y="1364">후보 없음</text>
  <rect class="stop" x="475" y="1380" width="180" height="120" rx="16"/>
  <text class="t" x="565" y="1418"><tspan class="strong" x="565">0건 × 3회</tspan><tspan class="small" x="565" dy="33">예약 중단</tspan><tspan class="small" x="565" dy="30">사람에게 알림</tspan></text>
  <path class="arrow" d="M655 1440 H665 V2310 H620"/>

  <path class="arrow" d="M250 1500 C250 1510 350 1510 350 1530"/>
  <rect class="gate" x="80" y="1530" width="540" height="100" rx="16"/>
  <text class="t" x="350" y="1571"><tspan class="strong" x="350">3. 단일 실행</tspan><tspan class="small" x="350" dy="34">동일 작업은 동시에 하나만</tspan></text>
  <path class="arrow" d="M350 1630 V1655"/>
  <rect class="gate" x="80" y="1655" width="540" height="100" rx="16"/>
  <text class="t" x="350" y="1696"><tspan class="strong" x="350">4. 실제 heartbeat</tspan><tspan class="small" x="350" dy="34">도구 호출과 출력으로 상태 갱신</tspan></text>
  <path class="arrow" d="M350 1755 V1780"/>
  <rect class="work" x="80" y="1780" width="540" height="100" rx="16"/>
  <text class="t" x="350" y="1821"><tspan class="strong" x="350">5. 격리 실행</tspan><tspan class="small" x="350" dy="34">분석 → 패치 → 검증</tspan></text>
  <path class="arrow" d="M350 1880 V1905"/>

  <polygon class="decision" points="350,1905 565,1975 350,2045 135,1975"/>
  <text class="t" x="350" y="1964"><tspan class="strong" x="350">6. 결과 분류</tspan><tspan class="small" x="350" dy="33">검증 성공 · 시스템 한계</tspan></text>

  <path class="arrow" d="M245 2010 C190 2040 175 2060 175 2080"/>
  <path class="arrow" d="M455 2010 C510 2040 525 2060 525 2080"/>
  <rect class="work" x="45" y="2080" width="280" height="150" rx="15"/>
  <text class="t" x="185" y="2122"><tspan class="strong" x="185">검증 성공</tspan><tspan class="small" x="185" dy="34">패치 · 테스트</tspan><tspan class="small" x="185" dy="31">한계와 함께 전달</tspan></text>
  <rect class="stop" x="375" y="2080" width="280" height="150" rx="15"/>
  <text class="t" x="515" y="2118"><tspan class="strong" x="515">실패 분류</tspan><tspan class="small" x="515" dy="34">timeout: 회차 종료</tspan><tspan class="small" x="515" dy="31">quota·파일: 중단·알림</tspan></text>

  <path class="arrow" d="M185 2230 C220 2240 250 2245 280 2250"/>
  <path class="arrow" d="M515 2230 C480 2240 450 2245 420 2250"/>
  <rect class="audit" x="80" y="2250" width="540" height="120" rx="16"/>
  <text class="t" x="350" y="2291"><tspan class="strong" x="350">감사 로그</tspan><tspan class="small" x="350" dy="34">생성자 · 변경자 · 예산</tspan><tspan class="small" x="350" dy="31">종료 이유를 기록</tspan></text>

  <path class="arrow" d="M350 2420 V2450"/>
  <rect class="good" x="40" y="2450" width="620" height="180" rx="20"/>
  <text class="t white strong" x="350" y="2495"><tspan x="350">일을 못 하면 안전하게 멈추고</tspan><tspan x="350" dy="36">일을 했으면 검토 가능한 상태로 전달한다</tspan><tspan class="small white" x="350" dy="42">중단 조건 · 예산 · 완료 정의는</tspan><tspan class="small white" x="350" dy="32">프롬프트가 아니라 실행 시스템의 책임이다</tspan></text>
</svg>
